name: CI/CD

on:
  push:
    branches:
      - main
      - feature/deployment
    tags:
      - 'rev-*'
  workflow_dispatch:

concurrency:
  group: deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  testing:
    name: Testing
    uses: ./.github/workflows/testing.yaml

  build:
    name: Build and publish images
    runs-on: ubuntu-24.04
    needs: [testing]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-backend:${{ github.sha }}

      - name: Push backend version tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-backend:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-backend:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-backend:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-backend:${{ github.ref_name }}

      - name: Verify backend image health
        run: |
          docker run -d --name backend-check \
            -e SECRET_KEY=healthcheck-key \
            -e DEBUG=False \
            -e USE_SQLITE=True \
            -p 8000:8000 \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-backend:${{ github.sha }}
          healthy=0
          for i in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/localhost/8000' 2>/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker rm -f backend-check
          if [ "$healthy" -ne 1 ]; then
            echo "Backend not healthy after 30 attempts."
            exit 1
          fi
          echo "Backend healthy."

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-frontend:${{ github.sha }}

      - name: Push frontend version tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-frontend:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-frontend:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-frontend:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-frontend:${{ github.ref_name }}

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-24.04
    needs: build
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer compose file
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /home/ralf-hamacher/pixora"
          scp docker-compose.yaml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ralf-hamacher/pixora/

      - name: Create remote .env only if missing
        run: |
          cat > .env.new << EOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DJANGO_ADMIN_USER=${{ secrets.DJANGO_ADMIN_USER }}
          DJANGO_ADMIN_EMAIL=${{ secrets.DJANGO_ADMIN_EMAIL }}
          DJANGO_ADMIN_PASSWORD=${{ secrets.DJANGO_ADMIN_PASSWORD }}
          DEBUG=${{ secrets.DEBUG }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          EOF
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'if [ -f /home/ralf-hamacher/pixora/.env ]; then echo ".env exists - preserving"; else cat > /home/ralf-hamacher/pixora/.env; echo ".env created"; fi' < .env.new
          rm -f .env.new

      - name: Pull images and retag to local
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "set -e
            docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-backend:${{ github.sha }}
            docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-frontend:${{ github.sha }}
            docker tag ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-backend:${{ github.sha }} pixora-backend:local
            docker tag ${{ env.REGISTRY }}/${{ env.OWNER }}/pixora-frontend:${{ github.sha }} pixora-frontend:local"

      - name: Start or update stack
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /home/ralf-hamacher/pixora && docker compose up -d --remove-orphans"

      - name: Smoke test
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            curl -sf http://localhost:4200 >/dev/null && echo 'Site reachable.'
            curl -sf http://localhost:4200/admin/ >/dev/null && echo 'Backend reachable via proxy.'
          "